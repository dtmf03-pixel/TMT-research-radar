    focus: [TMT, 미디어엔터, IFRS]

  - firm: 삼일PwC
    name: PwC Korea Insights
    url: https://www.pwc.com/kr/ko/insights.html
    type: html
    focus: [TMT, 엔터미디어, 회계기준]

