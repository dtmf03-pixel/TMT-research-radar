name: news-board

# 뉴스 보드(docs/index.html)만 매일 갱신한다.
# DART·회계리포트 수집은 성격상 매일 돌 필요가 없어 research.yml 에 주 1회로 남겨뒀다.
on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST (22:00 UTC 전날)
  workflow_dispatch:
    inputs:
      window:
        description: "수집 기간 (예: 1d, 2d, 7d)"
        default: "2d"

permissions:
  contents: write

# research.yml 과 같은 브랜치에 커밋하므로 동시에 돌지 않게 묶는다.
# (둘 다 월요일 아침에 돌아 한 시간 간격으로 겹칠 수 있다)
concurrency:
  group: radar-commit
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    env:
      BOARD_WINDOW: ${{ inputs.window || '2d' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect news board
        run: python scripts/news_board.py

      - name: Fetch card thumbnails
        run: python scripts/news_thumbs.py || true   # 실패해도 보드는 그대로 나온다

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit results
        run: |
          git config user.name "research-radar-bot"
          git config user.email "actions@github.com"
          git add data/news_board.json data/thumbs_cache.json docs/
          git diff --staged --quiet && exit 0
          git commit -m "chore: news board $(date -u +%F)"
          git pull --rebase --autostash origin ${GITHUB_REF_NAME}
          git push
