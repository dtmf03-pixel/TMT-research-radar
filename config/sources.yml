# 회계법인 산업 리포트 / 인사이트 소스
#
# [구조]
#  firms   — 자동 수집 대상. report_collector.py 가 신규 발간물을 긁는다.
#  curated — 상시 제공 링크(수동 관리). 대형 회계법인 사이트는 리포트 목록을
#            JavaScript로 렌더링해 정적 크롤러로는 실제 발간물이 잡히지 않는다.
#            헤드리스 브라우저는 CI에서 불안정하므로, TMT 인사이트 허브를
#            큐레이션 링크로 고정 제공하고 자동 수집은 보조로 둔다.

firms:
  # 실제로 정적 HTML에서 발간물이 잡히는 곳 위주
  - firm: 삼정KPMG
    name: KPMG 경제연구원(ERI)
    url: https://kpmg.com/kr/ko/insights/eri.html
    type: html
    focus: [미디어통신, 게임, 콘텐츠]

  - firm: 삼정KPMG
    name: 삼정KPMG Insights
    url: https://kpmg.com/kr/ko/insights.html
    type: html
    focus: [IFRS, 감사위원회]

  - firm: EY한영
    name: EY Korea Insights
    url: https://www.ey.com/ko_kr/insights
