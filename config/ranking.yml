# 기사 정렬 — '화제도' 점수 가중치.
#
# 클릭수·좋아요·댓글수 같은 반응 지표는 네이버·다음·구글 어디도 외부에 공개하지
# 않는다. 그래서 아래 네 가지를 대리 지표로 쓴다. 가장 무게가 큰 건 보도량으로,
# 같은 사건을 여러 언론사가 동시에 받아쓴 기사가 곧 화제가 된 기사다.
#
#   ① 보도량   같은 사건을 보도한 언론사 수 (제목 유사도로 묶음)
#   ② 매체     주요 매체 보도 여부
#   ③ 최신성   최근 기사 가산
#   ④ Google   Google 뉴스 자체 노출 순위 (관련도·중요도가 반영된 값)

# 제목 유사도 임계값. 높이면 덜 묶이고(같은 사건이 쪼개짐),
# 낮추면 과하게 묶인다(다른 사건이 합쳐짐). 0.4~0.5 권장.
similarity_threshold: 0.42

# 기존 묶음에 합치려면 그 안의 기사 몇 건과 유사해야 하는지.
# 1로 두면 한 건만 스쳐도 붙어서 사건이 연쇄적으로 뭉친다(A~B, B~C 이면 A와 C가
# 안 닮았어도 한 덩어리가 됨). 2면 그 연쇄가 끊긴다. 묶음이 1건일 땐 1건만 봐도 된다.
min_matches: 2

# 수집 기간이 2일이라 기사 대부분이 48시간 안에 들어온다. 그래서 최신성은
# '오늘 것이냐 어제 것이냐'를 가르는 역할만 하고, 값은 언론사 2곳 남짓의 무게로 잡았다.
# 기간을 7d 로 늘린다면 within_24h 를 3 정도로 낮춰야 보도량이 제 몫을 한다.
weights:
  per_outlet: 3       # 같은 사건을 보도한 언론사 1곳당 (첫 곳 제외)
  major_outlet: 2     # major_outlets 에 해당하는 매체가 보도
  within_24h: 5       # 24시간 이내
  within_72h: 1       # 24~72시간
  google_top10: 2     # Google 뉴스 상위 10위 이내
  google_top30: 1     # 상위 30위 이내

# 통신사·주요 일간지·경제지·방송. 부분일치로 비교하므로 대표 표기만 적으면 된다.
major_outlets:
  - 연합뉴스
  - 뉴시스
  - 뉴스1
  - 조선
  - 중앙일보
  - 동아일보
  - 한겨레
  - 경향신문
  - 매일경제
  - 한국경제
  - 서울경제
  - 머니투데이
  - 이데일리
  - 파이낸셜뉴스
  - 아시아경제
  - 헤럴드경제
  - 전자신문
  - 디지털타임스
  - KBS
  - MBC
  - SBS
  - YTN
  - JTBC
