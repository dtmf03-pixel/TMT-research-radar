name: research-radar

# 매주 월요일 08:00 KST(월 23:00 UTC 일요일) 자동 실행 + 수동 실행 가능.
# 뉴스 보드(docs/index.html)는 갱신 주기가 달라 news-board.yml 로 분리했다.
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write   # 갱신된 README/데이터 커밋용

# news-board.yml 과 커밋이 겹치지 않게 같은 그룹으로 묶는다.
concurrency:
  group: radar-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Update DART corp codes
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update_corp_codes.py || true

      - name: Collect DART
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/dart_collector.py || true

      - name: Monitor news
        run: python scripts/news_monitor.py || true   # Google 뉴스 RSS — 키 불필요

      - name: Collect firm reports
        run: python scripts/report_collector.py || true

      - name: Build dashboard
        run: python scripts/build_dashboard.py

      - name: Commit results
        run: |
          git config user.name "research-radar-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "chore: weekly research update $(date +%F)"
          git pull --rebase --autostash origin ${GITHUB_REF_NAME}
          git push
